name: Build and release

# Every push to main that changes anything beyond docs bumps the patch version automatically
# (1.8.1 -> 1.8.2 -> ... -> 1.8.9 -> 1.9 -> 1.9.1 ...), commits the bump, builds the signed APK,
# and publishes a tagged GitHub release with checksums. Doc-only pushes (README, LICENSE, this
# workflow, ...) are detected by diffing the push and skip the release entirely - paths filters
# are deliberately not used for that: GitHub's push path matching can swallow mixed doc+code
# pushes, which would silently drop a release.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.gate.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect docs-only push
        id: gate
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          FILES=$(git diff --name-only "$BEFORE" HEAD || echo "app/build.gradle.kts")
          echo "changed files: $FILES"
          DOCS_ONLY=true
          for f in $FILES; do
            case "$f" in
              *.md|LICENSE|.gitignore|.gitattributes|.github/*) ;;
              *) DOCS_ONLY=false ;;
            esac
          done
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"

  release:
    needs: changes
    # The version-bump commit is authored by the bot and marked [skip ci]; the actor check keeps
    # the loop broken even if that marker is ever edited away.
    if: needs.changes.outputs.docs_only != 'true' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # AGP downloads the pinned NDK (27.3.13750724) itself once licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPS_BASE64: ${{ secrets.KEYSTORE_PROPS_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          else
            echo "::warning::KEYSTORE_BASE64 not set - the APK will fall back to the debug key"
          fi
          if [ -n "$KEYSTORE_PROPS_BASE64" ]; then
            echo "$KEYSTORE_PROPS_BASE64" | base64 -d > keystore.properties
          fi

      - name: Bump version
        id: bump
        run: |
          CUR=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CUR"
          if [ -z "$PATCH" ]; then
            # "1.9" -> "1.9.1"
            NEW="$MAJOR.$MINOR.1"
          else
            PATCH=$((PATCH + 1))
            if [ "$PATCH" -ge 10 ]; then
              PATCH=0
              MINOR=$((MINOR + 1))
            fi
            # "1.8.9" rolls to "1.9", then "1.9.1"
            if [ "$PATCH" -eq 0 ]; then
              NEW="$MAJOR.$MINOR"
            else
              NEW="$MAJOR.$MINOR.$PATCH"
            fi
          fi
          NEWCODE=$((CODE + 1))
          sed -i "s/versionName = \"$CUR\"/versionName = \"$NEW\"/" app/build.gradle.kts
          sed -i "s/versionCode = $CODE/versionCode = $NEWCODE/" app/build.gradle.kts
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "code=$NEWCODE" >> "$GITHUB_OUTPUT"
          echo "Bumped $CUR -> $NEW (versionCode $NEWCODE)"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git push origin main

      # The repo path contains a space, so the ndk-build mirror dirs must be redirected to a safe path.
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease checksums \
            -PjniMirrorDir="$PWD/.ci/jni" -PbuildMirrorDir="$PWD/.ci/build"

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          APK_DIR: .ci/build/outputs/apk/release
        run: |
          TAG="v${VERSION}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "NordOptimizer LSPosed v${VERSION}" \
            --notes "Automated build of commit $(git rev-parse --short HEAD). Install with: adb install -r NordOptimizer-v${VERSION}-signed.apk" \
            "$APK_DIR/NordOptimizer-v${VERSION}-signed.apk" \
            "$APK_DIR/NordOptimizer-v${VERSION}-signed.apk.sha256" \
            "$APK_DIR/NordOptimizer-v${VERSION}-signed.apk.md5"
